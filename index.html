      const shuffle = (a) => {
        a = [...a];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;

      const fmtDate = (ts) => {
        const d = new Date(ts);
        return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      };
      function km(a, b) {
        const R = 6371,
          r = (x) => (x * Math.PI) / 180,
          dl = r(b.lat - a.lat),
          dn = r(b.lng - a.lng);
        const h =
          Math.sin(dl / 2) ** 2 +
          Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dn / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      }

      const mem = {};
      const store = {
        async get(k) {
          try {
            if (window.storage) {
              const r = await window.storage.get(k);
              if (r && r.value) return JSON.parse(r.value);
            } else {
              const v = localStorage.getItem(k);
              if (v) return JSON.parse(v);
            }
          } catch (e) {}
          return mem[k] ?? null;
        },
        async set(k, v) {
          mem[k] = v;
          try {
            if (window.storage) await window.storage.set(k, JSON.stringify(v));
            else localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        },
      };

      const norm = (s) =>

      function bigrams(s) {
        const a = norm(s),
          r = new Set();
        if (a.length < 2) {

        for (let i = 0; i < a.length - 1; i++) r.add(a.slice(i, i + 2));

      function sim(a, b) {
        const A = bigrams(a),

        let n = 0;
        A.forEach((x) => {

        const u = A.size + B.size - n;
        return u ? n / u : 0;

          else if (nn.startsWith(nq)) s = 80;
          else if (nn.includes(nq)) s = 60;
          else if (nn.length >= 3 && nq.includes(nn)) s = 55;
          else if (isCho && cho(nn).includes(nq)) s = 52;

          if (s > best) best = s;

      /* ===== 뷰: 스캔 (AI 카메라 · 바코드) ===== */
      function vScan() {

      function barPane() {

    .slice(0, 6)

      }
      function prep(file) {
        return new Promise((res, rej) => {
          const img = new Image(),
            url = URL.createObjectURL(file);
          img.onload = () => {
            const cv = (w) => {
              const s = Math.min(1, w / Math.max(img.width, img.height));
              const c = document.createElement("canvas");
              c.width = Math.round(img.width * s);
              c.height = Math.round(img.height * s);
              c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
              return c.toDataURL("image/jpeg", 0.8);
            };
            const full = cv(1024),
              thumb = cv(200);
            URL.revokeObjectURL(url);
            res({ b64: full.split(",")[1], thumb });
          };
          img.onerror = rej;
          img.src = url;
        });
      }
      async function aiRecognize(b64) {
        const list = S.db.items.map((i) => `${i.id}: ${i.name}`).join("\n");
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-6",
            max_tokens: 1000,
            system:
              '당신은 한국 분리배출 품목 분류기입니다. 사진 속 주된 쓰레기 품목을 아래 목록에서 가장 가까운 하나로 고르세요. 목록에 맞는 것이 없으면 matched_id를 null로 하세요. 반드시 JSON 객체 하나만 출력하고 다른 글자나 마크다운은 쓰지 마세요. 형식: {"matched_id": 문자열 또는 null, "seen": "사진에서 본 품목 이름", "confidence": 0에서 1 사이 숫자, "reason": "한국어 한 문장"}\n\n목록:\n' +
              list,
            messages: [
              {
                role: "user",
                content: [
                  {
                    type: "image",
                    source: {
                      type: "base64",
                      media_type: "image/jpeg",
                      data: b64,
                    },
                  },
                  { type: "text", text: "이 쓰레기는 어떤 품목인가요?" },
                ],
              },
            ],
          }),
        });
        if (!res.ok) throw new Error("api " + res.status);
        const data = await res.json();
        const text = (data.content || [])
          .map((c) => (c.type === "text" ? c.text : ""))
          .join("");
        return JSON.parse(text.replace(/```json|```/g, "").trim());
      }
      function queueAdd(o) {
        if (
          o.type === "text" &&
          S.queue.some(
            (q) =>
              q.status === "pending" && q.type === "text" && q.text === o.text,
          )
        )
          return;
        S.queue.unshift({
          id: "q" + Date.now() + Math.random().toString(36).slice(2, 5),
          type: o.type,
          text: o.text || "",
          thumb: o.thumb || null,
          ts: Date.now(),
          status: "pending",
        });
        S.queue = S.queue.slice(0, 60);
        save();
      }
      async function handleImage(file) {
        if (!file) return;
        S.scan = { busy: true, thumb: null, msg: "" };
        render();
        let p;
        try {
          p = await prep(file);
        } catch (e) {
          S.scan = {
            busy: false,
            thumb: null,
            msg: "사진을 읽지 못했어요. 다른 사진을 선택해 주세요.",
          };
          render();
          return;
        }
        S.scan.thumb = p.thumb;
        render();
        try {
          const r = await aiRecognize(p.b64),
            it = r.matched_id && item(r.matched_id);
          if (it && r.confidence >= 0.5) {
            if (r.confidence < 0.75)
              queueAdd({ type: "image", text: r.seen || "", thumb: p.thumb });
            S.scan = { busy: false, thumb: p.thumb, msg: "" };
            S.detail = { id: it.id, source: "ai", meta: r, from: "scan" };
            S.tab = "search";
          } else {
            queueAdd({ type: "image", text: r.seen || "", thumb: p.thumb });
            S.scan = {
              busy: false,
              thumb: p.thumb,
              msg: '<div class="msg">품목을 확실히 알아보지 못했어요. 관리자 레이블링 대기열에 저장했어요.<br><button class="btn sm ghost mt" data-act="tab" data-tab="search">이름으로 검색하기</button></div>',
            };
          }
        } catch (e) {
          S.scan = {
            busy: false,
            thumb: p.thumb,
            msg: '<div class="msg">AI 인식에 실패했어요. 네트워크를 확인하거나 이름으로 검색해 주세요.<br><button class="btn sm ghost mt" data-act="tab" data-tab="search">이름으로 검색하기</button></div>',
          };
        }
        render();
      }
      function lookupBarcode(code) {
        code = String(code || "").replace(/\D/g, "");
        S.barNo = code;
        const b = S.db.barcodes.find((x) => x.code === code);
        if (b && item(b.itemId)) {
          S.barMsg = "";
          S.detail = {
            id: b.itemId,
            source: "barcode",
            meta: { code, product: b.product, material: b.material },
            from: "scan",
          };
          S.tab = "search";
        } else if (code.length < 8) {
          S.barMsg = "바코드 번호를 8자리 이상 입력해 주세요.";
        } else {
          S.barMsg =
            "등록되지 않은 바코드예요. 관리자 대기열에 남겼어요. 품목 이름으로 검색해 보세요.";
          queueAdd({ type: "barcode", text: code });
        }
        render();
      }
      async function barFromPhoto(file) {
        if (!file) return;
        if (!("BarcodeDetector" in window)) {
          S.barMsg =
            "이 브라우저는 사진으로 바코드를 읽지 못해요. 번호를 직접 입력해 주세요.";
          render();
          return;
        }
        try {
          const det = new BarcodeDetector({
              formats: ["ean_13", "ean_8", "upc_a", "upc_e"],
            }),
            bmp = await createImageBitmap(file),
            r = await det.detect(bmp);
          if (r.length) lookupBarcode(r[0].rawValue);
          else {
            S.barMsg = "바코드를 찾지 못했어요. 더 가까이서 다시 찍어 주세요.";
            render();
          }
        } catch (e) {
          S.barMsg = "바코드 인식에 실패했어요. 번호를 직접 입력해 주세요.";
          render();
        }
      }

      /* ===== 뷰: 수거함 지도 ===== */
      function vMap() {
        const r = region(),
          origin = S.geo || { lat: r.lat ?? 37.5665, lng: r.lng ?? 126.978 };
        const pts = S.db.points
          .filter((p) => S.mapFilter === "all" || p.type === S.mapFilter)
          .map((p) => ({ ...p, d: km(origin, p) }))
          .sort((a, b) => a.d - b.d)
          .slice(0, 12);
        const maxD = Math.max(1, ...pts.map((p) => p.d));
        S.mapPts = pts;
        S.mapOrigin = origin;
        const kx = Math.cos((origin.lat * Math.PI) / 180) * 111,
          ky = 111;
        const dots = pts
          .map((p, i) => {
            const x = 150 + (((p.lng - origin.lng) * kx) / maxD) * 115,
              y = 100 - (((p.lat - origin.lat) * ky) / maxD) * 85;
            const c = PT_TYPES[p.type].color;
            return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="${c}"/><text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${i + 1}</text>`;
          })
          .join("");
        return `<section class="pad"><h3 class="sec" style="margin-top:6px">${S.geo ? "내 위치 기준" : esc(r.name) + " 중심"} 가까운 수거함</h3>
  <div class="chips"><button class="chip ${S.mapFilter === "all" ? "on" : ""}" style="${S.mapFilter === "all" ? "background:var(--ink);color:#fff" : ""}" data-act="mapFilter" data-v="all">전체</button>${Object.entries(
    PT_TYPES,
  )
    .map(
      ([k, v]) =>
        `<button class="chip" style="${S.mapFilter === k ? "background:var(--ink);color:#fff" : ""}" data-act="mapFilter" data-v="${k}">${v.label}</button>`,
    )
    .join("")}</div>
  ${hasNaver() ? '<div id="nmap" class="plot mt" style="height:300px"></div>' : `<svg class="plot mt" viewBox="0 0 300 200" role="img" aria-label="수거함 상대 위치"><circle cx="150" cy="100" r="115" fill="none" stroke="#B9CCC2" stroke-dasharray="3 4"/><circle cx="150" cy="100" r="58" fill="none" stroke="#B9CCC2" stroke-dasharray="3 4"/><circle cx="150" cy="100" r="6" fill="#12302B"/>${dots}<text x="8" y="192" font-size="10" fill="#587069">바깥 원 약 ${maxD.toFixed(1)}km · 가운데가 ${S.geo ? "내 위치" : "지역 중심"}</text></svg>`}
  ${S.geo && S.geo.acc ? `<p class="fine">내 위치 정확도 약 ${Math.round(S.geo.acc)}m${S.geo.acc > 1000 ? " · PC는 Wi-Fi/IP로 위치를 추정해서 오차가 커요. 스마트폰에서는 GPS라 훨씬 정확해요." : ""}</p>` : ""}
  ${S.geo && (!pts.length || pts[0].d > 10) ? `<div class="msg">내 위치 10km 안에 등록된 수거함이 없어요. (샘플 데이터는 일부 지역에만 있어요. 관리자 메뉴에서 공공데이터 CSV를 가져올 수 있어요)<br><button class="btn sm ghost mt" data-act="demoPts">시연용: 내 위치 주변에 샘플 수거함 만들기</button></div>` : ""}
  <button class="btn ghost full" data-act="locate">내 위치로 정렬하기</button>
  <ul class="list">${pts.map((p, i) => `<li><div class="row"><span class="dot" style="background:${PT_TYPES[p.type].color}"></span><span class="rn">${i + 1}. ${esc(p.name)}<small>${PT_TYPES[p.type].label} · ${p.d.toFixed(1)}km</small></span><a class="btn sm ghost" target="_blank" rel="noopener" href="https://map.kakao.com/link/map/${encodeURIComponent(p.name)},${p.lat},${p.lng}">지도앱</a></div></li>`).join("") || '<li class="row">표시할 수거함이 없어요</li>'}</ul>
  <p class="fine">위치는 샘플 데이터예요. 실제 서비스에서는 지자체 공공데이터를 연동해요.</p></section>`;
      }

      /* ===== 네이버 지도 연동 ===== */
      const NAVER_CLIENT_ID = "kvj2zpj5yw"; // ← 네이버 클라우드 플랫폼 Application의 Client ID를 여기에 붙여넣기
      const hasNaver = () => !/^YOUR/.test(NAVER_CLIENT_ID);
      let naverP = null,
        naverAuthFail = false;
      const authMsg = () =>
        '<div style="padding:16px;font-size:13px"><b>지도 인증에 실패했어요.</b><br>네이버 콘솔의 Web 서비스 URL에 <b>' +
        esc(location.protocol + "//" + location.hostname) +
        "</b> 가 등록돼 있는지, Client ID가 맞는지 확인하세요.<br>localhost와 127.0.0.1은 서로 다른 주소로 취급돼요.</div>";
      function loadNaver() {
        if (window.naver && naver.maps && naver.maps.Service)
          return Promise.resolve();
        if (naverP) return naverP;
        naverP = new Promise((res, rej) => {
          window.navermap_authFailure = () => {
            naverAuthFail = true;
            const el = $("#nmap");
            if (el) el.innerHTML = authMsg();
            rej(new Error("auth"));
          };
          window.__naverReady = () => res();
          const sc = document.createElement("script");
          sc.src =
            "https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=" +
            encodeURIComponent(NAVER_CLIENT_ID) +
            "&submodules=geocoder&callback=__naverReady";
          sc.onerror = () => rej(new Error("load"));
          document.head.appendChild(sc);
        });
        naverP.catch(() => {
          naverP = null;
        });
        return naverP;
      }
      function reverseAddr(pos) {
        if (!hasNaver() || naverAuthFail) return Promise.resolve(null);
        return Promise.race([
          loadNaver().then(
            () =>
              new Promise((res) => {
                naver.maps.Service.reverseGeocode(
                  {
                    coords: new naver.maps.LatLng(pos.lat, pos.lng),
                    orders: [
                      naver.maps.Service.OrderType.ADDR,
                      naver.maps.Service.OrderType.ROAD_ADDR,
                    ].join(","),
                  },
                  (status, r) => {
                    if (
                      status !== naver.maps.Service.Status.OK ||
                      !r ||
                      !r.v2 ||
                      !r.v2.address
                    )
                      return res(null);
                    res(
                      r.v2.address.jibunAddress ||
                        r.v2.address.roadAddress ||
                        null,
                    );
                  },
                );
              }),
          ),
          new Promise((res) => setTimeout(() => res(null), 6000)),
        ]).catch(() => null);
      }
      async function initNaverMap() {
        const el = $("#nmap");
        if (!el) return;
        if (naverAuthFail) {
          el.innerHTML = authMsg();
          return;
        }
        try {
          await loadNaver();
        } catch (e) {
          el.innerHTML =
            '<div style="padding:16px;font-size:13px">지도를 불러오지 못했어요.<br>① Client ID가 맞는지 ② Web 서비스 URL에 현재 주소(예: http://localhost)가 등록돼 있는지 확인하세요.<br>③ 파일을 더블클릭(file://)하지 말고 http://localhost:포트 로 열어야 해요.</div>';
          return;
        }
        const o = S.mapOrigin,
          pts = S.mapPts || [],
          c = new naver.maps.LatLng(o.lat, o.lng);
        const map = new naver.maps.Map(el, { center: c, zoom: 15 });
        new naver.maps.Marker({
          map,
          position: c,
          title: S.geo ? "내 위치" : "기준 위치",
          icon: {
            content:
              '<div style="width:16px;height:16px;border-radius:50%;background:' +
              (S.geo ? "#1F6FD8" : "#12302B") +
              ";border:3px solid #fff;box-shadow:0 0 0 2px " +
              (S.geo ? "#1F6FD8" : "#12302B") +
              '"></div>',
            anchor: new naver.maps.Point(8, 8),
          },
        });
        const info = new naver.maps.InfoWindow({
          content: "",
          borderWidth: 0,
          disableAnchor: true,
          backgroundColor: "transparent",
        });
        let b = new naver.maps.LatLngBounds(c, c);
        pts.forEach((p, i) => {
          const pos = new naver.maps.LatLng(p.lat, p.lng);
          b.extend(pos);
          const m = new naver.maps.Marker({
            map,
            position: pos,
            title: p.name,
            icon: {
              content: `<div style="width:26px;height:26px;border-radius:50%;background:${PT_TYPES[p.type].color};color:#fff;font:700 12px sans-serif;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${i + 1}</div>`,
              anchor: new naver.maps.Point(13, 13),
            },
          });
          naver.maps.Event.addListener(m, "click", () => {
            info.setContent(
              `<div style="padding:8px 10px;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);font:13px sans-serif;color:#12302B"><b>${esc(p.name)}</b><br>${PT_TYPES[p.type].label}</div>`,
            );
            info.open(map, m);
          });
        });
        const pad = { top: 40, right: 40, bottom: 40, left: 40 };
        if (S.geo) {
          if (S.geo.acc)
            new naver.maps.Circle({
              map,
              center: c,
              radius: Math.min(S.geo.acc, 5000),
              fillColor: "#1F6FD8",
              fillOpacity: 0.12,
              strokeColor: "#1F6FD8",
              strokeOpacity: 0.5,
              strokeWeight: 1,
            });
          const near = pts.filter((p) => p.d <= 3).slice(0, 4);
          if (near.length) {
            const bb = new naver.maps.LatLngBounds(c, c);
            near.forEach((p) => bb.extend(new naver.maps.LatLng(p.lat, p.lng)));
            map.fitBounds(bb, pad);
          } else {
            map.setCenter(c);
            map.setZoom(16);
          }
        } else if (pts.length) map.fitBounds(b, pad);
      }

      function autoRegion(addr) {
        const t = addr.split(" ").filter(Boolean);
        if (!t.length) return null;
        const parts = [t[0]];
        for (let i = 1; i < t.length && parts.length < 3; i++) {
          if (/[시군구]$/.test(t[i])) parts.push(t[i]);
          else break;
        }
        if (parts.length < 2) return null;
        const name = parts.join(" "),
          ex = S.db.regions.find((r) => r.name === name);
        if (ex) return ex;
        const r = {
          id: "auto" + Date.now(),
          name,
          lat: S.geo.lat,
          lng: S.geo.lng,
          sched: mkSched([], [], [], ""),
          bag: "",
          note: "이 지역의 배출 지침은 아직 등록되지 않았어요. 관리자 메뉴에서 등록할 수 있어요.",
        };
        S.db.regions.push(r);
        return r;
      }

      /* ===== 공공데이터(행정안전부 생활쓰레기배출정보) 연동: server.py 의 /api/waste 사용 ===== */
      const DOWCH = "일월화수목금토";
      const PROV = {
        충북: "충청북",
        충남: "충청남",
        경북: "경상북",
        경남: "경상남",
        전북: "전라북",
        전남: "전라남",
      };
      const provKey = (s) => {
        s = String(s || "").replace(
          /특별시|광역시|특별자치시|특별자치도|도$/g,
          "",
        );
        return PROV[s] || s;
      };
      const hasSched = (r) =>
        ["recycle", "general", "food"].some(
          (c) => r.sched[c] && r.sched[c].days.length,
        );
      function parseDow(t) {
        t = String(t || "").replace(/요일/g, "");
        if (/매일|전일|상시/.test(t)) return [0, 1, 2, 3, 4, 5, 6];
        const m = t.match(/([일월화수목금토])\s*~\s*([일월화수목금토])/);
        if (m) {
          const a = DOWCH.indexOf(m[1]),
            b = DOWCH.indexOf(m[2]),
            o = [];
          for (let i = a, n = 0; n < 7; i = (i + 1) % 7, n++) {
            o.push(i);
            if (i === b) break;
          }
          return o;
        }
        const o = [];
        for (const ch of t) {
          const i = DOWCH.indexOf(ch);
          if (i >= 0 && !o.includes(i)) o.push(i);
        }
        return o;
      }
      function wasteCats(item) {
        const out = {};
        Object.keys(item).forEach((k) => {
          const m = k.match(/^(.*)_EMSN_DOW$/);
          if (!m) return;
          const pre = m[1];
          let cat;
          if (/FOD|FOOD/.test(pre)) cat = "food";
          else if (/RCYC|RECY|RSRC/.test(pre)) cat = "recycle";
          else if (/TMPR|TEMP|LGVL|LRG|BULK/.test(pre)) return;
          else cat = "general";
          out[cat] = {
            dow: item[k],
            bgn: item[pre + "_EMSN_BGNG_TM"],
            end: item[pre + "_EMSN_END_TM"],
            mthd: item[pre + "_EMSN_MTHD"],
            pre,
          };
        });
        return out;
      }
      function topVal(arr) {
        const c = {};
        arr.filter(Boolean).forEach((v) => (c[v] = (c[v] || 0) + 1));
        return Object.keys(c).sort((a, b) => c[b] - c[a])[0] || "";
      }
      async function loadPublicSched(r, silent) {
        const toks = r.name.split(" ").filter(Boolean),
          prov = provKey(toks[0]);
        const tries = toks.filter((t) => /[시군구]$/.test(t)).reverse();
        if (!tries.length) {
          if (!silent) toast("지역 이름에서 시·군·구를 찾지 못했어요");
          return false;
        }
        let items = [];
        try {
          for (const t of tries) {
            const res = await fetch("/api/waste?sgg=" + encodeURIComponent(t));
            const j = await res.json();
            if (j.error) {
              if (!silent) toast(j.error);
              return false;
            }
            const b = j.response && j.response.body;
            let it = b && b.items && b.items.item;
            if (!it) continue;
            if (!Array.isArray(it)) it = [it];
            const pf = it.filter(
              (x) => !x.CTPV_NM || provKey(x.CTPV_NM) === prov,
            );
            if (pf.length) {
              items = pf;
              break;
            }
          }
        } catch (e) {
          if (!silent)
            toast(
              "공공데이터 서버에 연결하지 못했어요. server.py를 켜고 localhost:8000 주소로 열어 주세요.",
            );
          return false;
        }
        if (!items.length) {
          if (!silent) toast("이 지역은 공공데이터에 배출 정보가 없어요");
          return false;
        }
        const per = { food: [], recycle: [], general: [] };
        items.forEach((it) => {
          const wc = wasteCats(it);
          Object.keys(wc).forEach((c) => per[c].push(wc[c]));
        });
        const keys = Object.keys(items[0]);
        const kUnc = keys.find((k) => /NCLCT|NOT_CLCT/.test(k)),
          kDept = keys.find((k) => /DEPT_NM|DEPT_NAME/.test(k)),
          kTel = keys.find((k) => /TELNO|TEL_NO/.test(k));
        const missing = [];
        let genMthd = "";
        ["recycle", "general", "food"].forEach((c) => {
          const list = per[c];
          if (!list.length) {
            missing.push(CAT[c].label);
            return;
          }
          const best = topVal(
            list.map((x) => [x.dow, x.bgn, x.end].join("|")),
          ).split("|");
          const days = parseDow(best[0]);
          if (!days.length) {
            missing.push(CAT[c].label);
            return;
          }
          r.sched[c] = {
            days,
            time:
              best[1] && best[2]
                ? best[1] + "~" + (best[2] === "00:00" ? "24:00" : best[2])
                : "",
          };
          if (c === "general") genMthd = topVal(list.map((x) => x.mthd));
        });
        if (genMthd) r.bag = genMthd.slice(0, 200);
        const upd = items
          .map((x) => x.DAT_UPDT_PNT || "")
          .sort()
          .reverse()[0];
        const parts = [
          "출처: 행정안전부 생활쓰레기배출정보" +
            (items.length > 1
              ? ` (${items.length}개 구역 중 가장 많은 설정)`
              : "") +
            (upd ? " · 기준 " + upd.slice(0, 10) : ""),
        ];
        const unc = kUnc && topVal(items.map((x) => x[kUnc])),
          dept = kDept && topVal(items.map((x) => x[kDept])),
          tel = kTel && topVal(items.map((x) => x[kTel]));
        if (unc) parts.push("미수거일: " + unc);
        if (dept) parts.push("문의: " + dept + (tel ? " " + tel : ""));
        r.note = parts.join(" · ");
        save();
        render();
        toast(
          missing.length
            ? `${r.name} 배출 정보를 불러왔어요 (${missing.join("·")} 항목은 찾지 못했어요)`
            : `${r.name} 배출 정보를 공공데이터로 채웠어요`,
        );
        return true;
      }

  ${csv ? '<button class="btn ghost danger full" data-act="ptClear">가져온 수거함 모두 삭제</button>' : ""}</div>`;

      function parseCsv(t) {
        const rows = [];
        let row = [],
          f = "",
          q = false;
        for (let i = 0; i < t.length; i++) {
          const c = t[i];
          if (q) {
            if (c === '"') {
              if (t[i + 1] === '"') {
                f += '"';
                i++;
              } else q = false;
            } else f += c;
          } else if (c === '"') q = true;
          else if (c === ",") {
            row.push(f);
            f = "";
          } else if (c === "\n" || c === "\r") {
            if (c === "\r" && t[i + 1] === "\n") i++;
            row.push(f);
            f = "";
            if (row.some((x) => x !== "")) rows.push(row);
            row = [];
          } else f += c;
        }
        if (f !== "" || row.length) {
          row.push(f);
          if (row.some((x) => x !== "")) rows.push(row);
        }
        return rows;
      }
      async function importCsv(file) {
        if (!file) return;
        const type = $("#csvType").value,
          flt = ($("#csvFilter").value || "").trim(),
          buf = await file.arrayBuffer();
        let text;
        try {
          text = new TextDecoder("utf-8", { fatal: true }).decode(buf);
        } catch (e) {
          try {
            text = new TextDecoder("euc-kr").decode(buf);
          } catch (e2) {
            toast("파일을 읽지 못했어요");
            return;
          }
        }
        const tt = text.replace(/^\uFEFF/, "").trim();
        let rows;
        if (tt[0] === "{" || tt[0] === "[") {
          let arr = null;
          try {
            const findArr = (o) => {
              if (Array.isArray(o))
                return o[0] && typeof o[0] === "object" && !Array.isArray(o[0])
                  ? o
                  : null;
              if (o && typeof o === "object") {
                for (const [, v] of Object.entries(o).sort(
                  ([a], [b]) => (a === "fields") - (b === "fields"),
                )) {
                  const a = findArr(v);
                  if (a) return a;
                }
              }
              return null;
            };
            arr = findArr(JSON.parse(tt));
          } catch (e) {}
          if (!arr || !arr.length) {
            toast("JSON에서 수거함 목록을 찾지 못했어요");
            return;
          }
          const head = Object.keys(arr[0]);
          rows = [head].concat(
            arr.map((x) => head.map((k) => (x[k] == null ? "" : String(x[k])))),
          );
        } else rows = parseCsv(tt);
        if (rows.length < 2) {
          toast("데이터가 비어 있어요");
          return;
        }
        const head = rows[0].map((h) => h.trim()),
          idx = (re) => head.findIndex((h) => re.test(h));
        const iLat = idx(/위도|latitude|^lat/i),
          iLng = idx(/경도|longitude|^lng|^lon|^lot$/i);
        if (iLat < 0 || iLng < 0) {
          toast(
            "위도·경도 항목을 찾지 못했어요. 주소만 있는 파일은 지원하지 않아요.",
          );
          return;
        }
        const iName = idx(
            /설치장소명|장소명|시설명|상세위치|설치위치|설치장소|수거함명|DTL_PSTN|INSTL_PLC_NM/i,
          ),
          iAddr = idx(/도로명|소재지|주소|ADDR|RDNMADR/i);
        const out = [];
        let skip = 0;
        for (let r = 1; r < rows.length; r++) {
          const row = rows[r],
            lat = parseFloat(row[iLat]),
            lng = parseFloat(row[iLng]);
          if (flt && !row.join(" ").includes(flt)) continue;
          if (!(lat >= 33 && lat <= 39 && lng >= 124 && lng <= 132)) {
            skip++;
            continue;
          }
          const nm =
            (iName >= 0 && row[iName]) ||
            (iAddr >= 0 && row[iAddr]) ||
            PT_TYPES[type].label;
          out.push({
            id: "csv" + Date.now() + "_" + r,
            region: S.user.regionId,
            type,
            name: String(nm).trim().slice(0, 40),
            lat,
            lng,
          });
          if (out.length >= 8000) break;
        }
        if (!out.length) {
          toast(
            flt
              ? `“${flt}”가 들어간 행이 없어요. 파일에 해당 지역이 없을 수 있어요.`
              : "가져올 수 있는 행이 없어요",
          );
          return;
        }
        S.db.points = S.db.points.concat(out);
        save();
        render();
        toast(
          `${out.length}곳을 가져왔어요` +
            (skip ? ` (좌표 없는 ${skip}곳은 제외)` : ""),
        );
      }

        if (!t) return;
        const f = A[t.dataset.act];
        if (f) f(t.dataset, t, e);
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "q") {
          S.q = e.target.value;
          updateSuggest();
        } else if (e.target.id === "barNo") {
          S.barNo = e.target.value;
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          if (e.target.id === "q") {
            e.preventDefault();
            A.doSearch();
          } else if (e.target.id === "barNo") {
            e.preventDefault();
            A.barLookup();
          }
        }
      });
      document.addEventListener("change", (e) => {
        const id = e.target.id,
          f = e.target.files && e.target.files[0];
        if (id === "camIn" || id === "camIn2") handleImage(f);
        else if (id === "barIn") barFromPhoto(f);
        else if (id === "csvIn") importCsv(f);
        if (e.target.type === "file") e.target.value = "";
      });

      /* ===== 시작 ===== */
      (async function init() {
        const [db, user, q] = await Promise.all([
          store.get("rc-db"),
          store.get("rc-user"),
          store.get("rc-queue"),
        ]);
        S.db = db && db.items && db.regions ? db : seedDB();
        if (!S.db.points) S.db.points = seedDB().points;
        if (!S.db.barcodes) S.db.barcodes = BARCODE_SEED.map((b) => ({ ...b }));
        if (user) Object.assign(S.user, user);
        if (q) S.queue = q;
        if (!S.db.regions.some((r) => r.id === S.user.regionId))
          S.user.regionId = S.db.regions[0].id;
        render();
      })();
    </script>
  </body>
</html>
